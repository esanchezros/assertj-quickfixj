name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }} / QuickFIX/J ${{ matrix.quickfixj }} / AssertJ ${{ matrix.assertj }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ 11, 17, 21, 25 ]
        quickfixj: [ 2.3.2, 3.0.2 ]
        assertj: [ 3.24.2, 3.27.7 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn --batch-mode -Dquickfixj.version=${{ matrix.quickfixj }} -Dassertj-core.version=${{ matrix.assertj }} verify

      - name: Install packaged artifact
        run: mvn --batch-mode -Dquickfixj.version=${{ matrix.quickfixj }} -Dassertj-core.version=${{ matrix.assertj }} -DskipTests -Djacoco.skip=true install

      - name: Verify packaged consumer
        run: mvn --batch-mode -f consumer-pom.xml -Dquickfixj.version=${{ matrix.quickfixj }} -Dassertj-core.version=${{ matrix.assertj }} clean test
